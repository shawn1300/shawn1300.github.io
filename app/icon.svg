<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 身体 -->
  <ellipse cx="14" cy="22" rx="7" ry="8" fill="#0a0a0a"/>
  <!-- 头 -->
  <circle cx="19" cy="14" r="5.5" fill="#0a0a0a"/>
  <!-- 脖子连接 -->
  <rect x="14" y="14" width="5" height="6" fill="#0a0a0a"/>
  <!-- 左耳（后面） -->
  <ellipse cx="17" cy="5" rx="1.8" ry="5" fill="#0a0a0a" transform="rotate(15 17 5)"/>
  <!-- 右耳（前面） -->
  <ellipse cx="21" cy="5.5" rx="1.8" ry="5.5" fill="#0a0a0a" transform="rotate(10 21 5.5)"/>
  <!-- 尾巴 -->
  <circle cx="7" cy="20" r="2.5" fill="#0a0a0a"/>
  <!-- 前腿 -->
  <ellipse cx="21" cy="24" rx="2" ry="3" fill="#0a0a0a"/>
  <!-- 后腿 -->
  <ellipse cx="10" cy="27" rx="3" ry="3" fill="#0a0a0a"/>
  <!-- 眼睛（白色圆点） -->
  <circle cx="21.5" cy="13" r="1" fill="#fafafa"/>
  <!-- 鼻子 -->
  <circle cx="24" cy="15" r="0.7" fill="#fafafa"/>
</svg>
